name: ci
on:
  push:
  pull_request:

jobs:
  linux:
    # The portable core: unit tests (incl. OpenSSL decrypting our PEMs) and
    # the end-to-end test against examples/fake_node.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --all-targets
      # The F1R3Games end-to-end test runs the real f1r3games-service.
      - id: g
        run: python3 -c "import tomllib;print('rev='+tomllib.load(open('versions.toml','rb'))['f1r3games']['revision'])" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with: { repository: F1R3FLY-io/F1R3Games, ref: "${{ steps.g.outputs.rev }}", path: f1r3games }
      - run: cargo build --locked --manifest-path f1r3games/Portal/f1r3games-portal/Cargo.toml -p f1r3games-service -p f1r3games-cli   # the CLI names F1R3Ink's relay (G7)
      - run: cargo test --locked -- --test-threads=1
        env:
          IGN1T10N_TEST_GAMES_BIN: ${{ github.workspace }}/f1r3games/Portal/f1r3games-portal/target/debug/f1r3games-service

  macos:
    # The AppKit menu bar and platform::macos only compile here.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --target aarch64-apple-darwin --all-targets
      - run: cargo test --locked --target aarch64-apple-darwin -- --test-threads=1
        env:
          IGN1T10N_DEV_SECRETS: "1"
